name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Supabase vars are public (NEXT_PUBLIC_*) and only need to be present
      # for the build to resolve. The app degrades to local-only mode without
      # them, and the question generator falls back to the seeded bank when
      # OPENAI_API_KEY is absent — so no secrets are required to build.
      - name: Build
        run: npm run build
